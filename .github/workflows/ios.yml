name: ios

on:
  push:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The protocol core, plus a two-way interop check against the Node
    # implementation (the one the relay's test bot uses with the Android app).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node encrypts test vectors
        run: node Interop/interop.mjs gen "$RUNNER_TEMP/interop"
      - name: Swift tests (decrypt Node's, produce our own)
        env:
          CELLOSIG_INTEROP: ${{ runner.temp }}/interop
          # A chat backup made here, for the Android app's tests to restore (ChatBackupTest).
          CELLOSIG_BACKUP_OUT: ${{ runner.temp }}/backup
        run: swift test --package-path Core
      - name: Node decrypts what Swift produced
        run: node Interop/interop.mjs verify "$RUNNER_TEMP/interop"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-chat-backup
          path: ${{ runner.temp }}/backup
          retention-days: 30

  app:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (iOS 26+ SDK, for the Liquid Glass design)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator (unsigned)
        run: |
          # Full output to a file; on failure show every error (a plain tail can cut them off).
          xcodebuild -project Cellosig.xcodeproj -scheme Cellosig \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -80; tail -n 30 build.log; exit 1; }
          tail -n 20 build.log

  sideload:
    # Unsigned device build to install with Sideloadly and a free Apple ID.
    # Free accounts can't use push, so no notification extension: messages and
    # calls arrive only while the app is open. Own bundle id, so the real
    # com.cellosig.app stays free for the paid team (TestFlight).
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (iOS 26+ SDK, for the Liquid Glass design)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project Cellosig.xcodeproj -scheme Cellosig -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CELLOSIG_BUNDLE_ID=com.cellosig.sideload \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -80; tail -n 30 build.log; exit 1; }
          tail -n 20 build.log
      - name: Package IPAs
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/Cellosig.app
          # No push for free accounts: keep-alive instead, and no notification extension.
          sideload_plist() {
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$1" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$1"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$1"
            # CallKit refuses incoming calls without it (no PushKit pushes come anyway).
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string voip" "$1"
            /usr/libexec/PlistBuddy -c "Add :CellosigKeepAlive bool true" "$1"
            # Shown in Settings → About, so you can tell which IPA is installed.
            /usr/libexec/PlistBuddy -c "Add :CellosigBuildDate string $(date -u +%Y-%m-%dT%H:%M:%SZ)" "$1"
            /usr/libexec/PlistBuddy -c "Add :CellosigCommit string ${GITHUB_SHA::7}" "$1"
          }

          # 1) Plain: no extensions at all (installs with any free Apple ID).
          mkdir -p plain/Payload
          cp -R "$APP" plain/Payload/
          rm -rf plain/Payload/Cellosig.app/PlugIns
          sideload_plist plain/Payload/Cellosig.app/Info.plist
          (cd plain && zip -qry ../cellosig-sideload.ipa Payload)

          # 2) With the widget and Share to cellosig. Those need an App Group, so
          #    the bundles carry it as an entitlement (ad-hoc signature) for the
          #    signing tool to register. Its own group name: the real one stays
          #    free for the paid team. (Uses 3 of a free account's 3 app slots.)
          mkdir -p full/Payload
          cp -R "$APP" full/Payload/
          A=full/Payload/Cellosig.app
          rm -rf "$A/PlugIns/CellosigNotify.appex"
          sideload_plist "$A/Info.plist"
          cat > group.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.com.cellosig.sideload</string></array>
          </dict></plist>
          EOF
          for f in "$A"/Frameworks/*; do if [ -e "$f" ]; then codesign -f -s - "$f"; fi; done
          for x in "$A"/PlugIns/*.appex; do codesign -f -s - --entitlements group.plist "$x"; done
          codesign -f -s - --entitlements group.plist "$A"
          codesign -d --entitlements - "$A/PlugIns/CellosigWidget.appex"
          (cd full && zip -qry ../cellosig-sideload-widgets.ipa Payload)
          ls -l *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: cellosig-sideload
          path: |
            cellosig-sideload.ipa
            cellosig-sideload-widgets.ipa
          retention-days: 30

  testflight:
    # Needs repository secrets (see README): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.
    needs: [core, app]
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (iOS 26+ SDK, for the Liquid Glass design)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive (automatic signing via the API key)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project Cellosig.xcodeproj -scheme Cellosig -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Cellosig.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -n 200
      - name: Export and upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cellosig.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 100
