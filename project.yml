# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed).
name: Cellosig
options:
  bundleIdPrefix: com.cellosig
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Overridden for the sideload build (a free Apple ID must not claim the real bundle id).
    CELLOSIG_BUNDLE_ID: com.cellosig.app
packages:
  CellosigCore:
    path: Core
  # Google's WebRTC, prebuilt (binary xcframework) — same engine the Android app uses.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: 114.0.0
    maxVersion: 200.0.0
targets:
  Cellosig:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CellosigCore
      - package: WebRTC
      - target: CellosigNotify
      - target: CellosigShare
      - target: CellosigWidget
    entitlements:
      path: App/Cellosig.entitlements
      properties:
        aps-environment: development   # export for TestFlight/App Store switches it to production
        com.apple.security.application-groups:
          - group.com.cellosig.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cellosig.shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: cellosig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CellosigKeychainGroup: $(AppIdentifierPrefix)com.cellosig.shared
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryAddUsageDescription: Save photos from your chats.
        NSMicrophoneUsageDescription: For calls and voice notes. Audio is end-to-end encrypted.
        NSFaceIDUsageDescription: Unlock cellosig when App lock is on.
        NSContactsUsageDescription: Show your contacts' names and find which of them use cellosig. Only phone numbers are sent to the relay to check; names stay on your iPhone.
        NSSpeechRecognitionUsageDescription: Turn voice notes into text, on your iPhone only (nothing is sent to Apple).
        UIBackgroundModes: [remote-notification, voip, audio]
        # cellosig://chat?id=… (the widget opens a chat with it)
        CFBundleURLTypes:
          - CFBundleURLName: com.cellosig.links
            CFBundleURLSchemes: [cellosig]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELLOSIG_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  # Fetches and decrypts mail when the relay's push arrives (shares keys via the App Group + keychain group).
  CellosigNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared
      - path: App/Storage
      - path: App/Net
      - path: App/Messaging
    dependencies:
      - package: CellosigCore
    entitlements:
      path: Notify/CellosigNotify.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cellosig.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cellosig.shared
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: cellosig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CellosigKeychainGroup: $(AppIdentifierPrefix)com.cellosig.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELLOSIG_BUNDLE_ID).notify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # "Share to cellosig": queues what you shared in the App Group; the app sends it.
  CellosigShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExt
      - path: Shared
    entitlements:
      path: ShareExt/CellosigShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cellosig.app
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: cellosig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock cellosig when App lock is on.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELLOSIG_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # Home Screen / Lock Screen widgets (read the app's widget.json in the App Group).
  CellosigWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/CellosigWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cellosig.app
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: cellosig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELLOSIG_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Cellosig:
    build:
      targets:
        Cellosig: all
